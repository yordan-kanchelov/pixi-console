name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code or a link (e.g. PixiJS playground, StackBlitz) that shows the problem.
      render: ts
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: pixi-console 5.0.0, pixi.js 8.21.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: Chrome 140 on Android 15, WebGL
