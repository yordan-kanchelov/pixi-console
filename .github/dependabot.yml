version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-config-prettier", "globals", "prettier"]
      test:
        patterns: ["vitest", "@vitest/*", "playwright", "jsdom"]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint and typedoc do not support TypeScript 7 yet
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Keep the Node types on the lowest Node version CI runs
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
